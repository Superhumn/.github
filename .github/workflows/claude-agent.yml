name: Claude Code Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  check_suite:
    types: [completed]
  push:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: claude-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.check_suite.pull_requests[0].number || github.event.check_suite.id || github.run_id }}
  cancel-in-progress: true

env:
  REPO_GUIDANCE: |
    Before making changes, read CLAUDE.md and AGENTS.md at the repo root if
    they exist for repo-specific conventions (commands, style, do-not-touch
    areas). Run any lint/test commands documented there before pushing.

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      use_auto_merge: ${{ steps.check.outputs.use_auto_merge }}
    steps:
      - name: Check rate limit and app config
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CAP: ${{ vars.CLAUDE_DAILY_RUN_CAP || '50' }}
          APP_ID: ${{ vars.CLAUDE_APP_ID }}
        run: |
          today=$(date -u +%Y-%m-%d)
          count=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Claude Code Agent") | select(.created_at | startswith("'"$today"'"))] | length' 2>/dev/null || echo 0)
          echo "Today's Claude Agent runs: $count / $CAP"
          if [ "$count" -ge "$CAP" ]; then
            echo "::warning::Daily Claude Agent run cap ($CAP) reached for ${{ github.repository }}; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$APP_ID" ]; then
            echo "use_auto_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLAUDE_APP_ID is not set; auto-merge will be disabled because GITHUB_TOKEN pushes cannot trigger downstream CI."
            echo "use_auto_merge=false" >> "$GITHUB_OUTPUT"
          fi

  review-and-fix-pr:
    needs: preflight
    if: >-
      needs.preflight.outputs.should_run == 'true' &&
      !startsWith(github.event.pull_request.head.ref, 'claude/') &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        (github.event.pull_request.user.type != 'Bot' ||
         contains(fromJSON('["dependabot[bot]","renovate[bot]","mend[bot]"]'),
                  github.event.pull_request.user.login))) ||
       (github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved' &&
        github.event.pull_request.draft == false &&
        github.event.review.user.type != 'Bot'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Check PR size
        id: size
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CAP: ${{ vars.CLAUDE_PR_LOC_CAP || '5000' }}
        run: |
          stats=$(gh pr view "$PR_NUMBER" --json additions,deletions)
          total=$(echo "$stats" | jq '.additions + .deletions')
          echo "Total LOC changed: $total / cap $CAP"
          if [ "$total" -gt "$CAP" ]; then
            echo "PR too large; skipping Claude review."
            # Post a one-time comment so the PR author knows why.
            marker="<!-- claude-loc-skip -->"
            existing=$(gh pr view "$PR_NUMBER" --json comments --jq ".comments[] | select(.body | contains(\"$marker\")) | .id" | head -1)
            if [ -z "$existing" ]; then
              body="${marker} Skipping automated review: PR is **${total} LOC**, above the ${CAP}-LOC cap. Split into smaller PRs to get a review, or raise \`CLAUDE_PR_LOC_CAP\` for this repo."
              gh pr comment "$PR_NUMBER" --body "$body" || true
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.size.outputs.skip == 'false'
        env:
          USE_AUTO_MERGE: ${{ needs.preflight.outputs.use_auto_merge }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          prompt: |
            ${{ env.REPO_GUIDANCE }}

            Review this PR. If there are bugs, security issues, or code quality
            problems, fix them. First try pushing fixup commits to the PR
            branch; if the push is rejected (protected branch, required
            reviews, signed commits, fork without write access), instead open
            a new PR from a `claude/fixup-<pr-number>` branch targeting the
            original PR branch and link it in a review comment. Always post a
            short comment explaining what you changed or, if the code looks
            good, a brief approval comment.

            Auto-merge enabled for this run: ${{ needs.preflight.outputs.use_auto_merge }}.
            If "true" and the PR looks clean (no bugs, security issues, or
            quality problems remaining), squash-merge it with
            `gh pr merge <pr-number> --squash --auto --delete-branch` so the
            merge waits for required status checks. Skip the merge if: the PR
            is from a fork without write access, targets a protected branch
            you cannot merge to, is still a draft, you just pushed fixup
            commits that need CI to re-verify, or you found a blocking issue.
            If "false", do not call `gh pr merge --auto` (GITHUB_TOKEN pushes
            cannot trigger downstream CI, so --auto would wait forever);
            leave the PR for a human to merge.

            Never force-merge or bypass branch protection.
          claude_args: --model claude-sonnet-4-6

  fix-issue:
    needs: preflight
    if: >-
      needs.preflight.outputs.should_run == 'true' &&
      github.event_name == 'issues' &&
      github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      issues: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          prompt: |
            ${{ env.REPO_GUIDANCE }}

            Read this issue. Create a `claude/issue-<issue-number>` branch,
            implement the fix or feature, run any available tests, then open
            a PR linking the issue. Keep changes minimal.

            Auto-merge enabled for this run: ${{ needs.preflight.outputs.use_auto_merge }}.
            If "true", after opening the PR enable auto-merge with
            `gh pr merge <pr-number> --squash --auto --delete-branch` so it
            squash-merges itself once required status checks pass. If
            auto-merge is rejected by the repo (feature disabled, branch
            protection mismatch), leave the PR open and note it in a PR
            comment. If "false", do not enable auto-merge; leave the PR for
            a human to merge.
          claude_args: --model claude-haiku-4-5

  respond-to-mention:
    needs: preflight
    if: >-
      needs.preflight.outputs.should_run == 'true' &&
      ((github.event_name == 'issue_comment' &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@claude')) ||
       (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@claude')) ||
       (github.event_name == 'pull_request_review' &&
        github.event.review.state == 'changes_requested' &&
        github.event.review.user.type != 'Bot'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      issues: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          prompt: |
            ${{ env.REPO_GUIDANCE }}

            A human reviewer left feedback on a PR or issue (either an
            @claude mention in a comment, an inline review comment, or a
            "changes requested" review). Read the feedback and the
            surrounding context (the PR diff, the file the comment is
            anchored to, the issue body, prior comments).

            If the feedback asks for a code change and you can address it,
            push a fixup commit to the PR branch and reply to the comment
            explaining what you changed. If the request is ambiguous,
            architectural, or out of scope, reply asking the reviewer to
            clarify or explaining why you're not making the change. If it's
            a question, answer it. Keep replies short.

            Do not merge the PR from this job — let the next
            `pull_request`/`pull_request_review` run re-evaluate after CI.
          claude_args: --model claude-sonnet-4-6

  fix-ci-failure:
    needs: preflight
    if: >-
      needs.preflight.outputs.should_run == 'true' &&
      github.event_name == 'check_suite' &&
      github.event.check_suite.conclusion == 'failure' &&
      github.event.check_suite.pull_requests[0] != null &&
      startsWith(github.event.check_suite.head_branch, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      checks: read
      actions: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.check_suite.head_sha }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Check retry budget
        id: budget
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_NUMBER: ${{ github.event.check_suite.pull_requests[0].number }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          attempts=$(echo "$labels" | grep -c '^claude-ci-retry-' || true)
          echo "Prior CI-fix attempts: $attempts"
          if [ "$attempts" -ge 3 ]; then
            echo "Retry budget exhausted; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            next=$((attempts + 1))
            label="claude-ci-retry-$next"
            gh label create "$label" --color ededed --description "Claude CI-fix attempt $next" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --add-label "$label" || true
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.budget.outputs.skip == 'false'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          prompt: |
            ${{ env.REPO_GUIDANCE }}

            A check suite failed on PR
            #${{ github.event.check_suite.pull_requests[0].number }}
            (branch `${{ github.event.check_suite.head_branch }}`, head
            `${{ github.event.check_suite.head_sha }}`). Inspect the failing
            check runs via `gh run list` / `gh run view --log-failed`, find
            the root cause, fix it, and push a fixup commit to the branch.
            If the failure is flaky or external (transient network, third-
            party outage), just re-run the failing jobs with `gh run rerun
            --failed` instead of pushing a code change. If the failure is
            outside your scope (requires secrets you don't have, depends on
            infra you can't reach, or needs architectural decisions), post
            a short PR comment explaining the blocker and stop.

            Do not merge or close the PR from this job.
          claude_args: --model claude-sonnet-4-6

  rebase-stale-prs:
    needs: preflight
    if: >-
      needs.preflight.outputs.should_run == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Update branches without conflicts
        id: update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          conflicts=""
          # Snapshot open claude/* PRs and act on each.
          gh pr list --state open --limit 100 \
            --json number,headRefName,mergeStateStatus \
            --jq '.[] | select(.headRefName | startswith("claude/")) | "\(.number) \(.mergeStateStatus)"' \
            | while read -r number state; do
                echo "PR #$number state=$state"
                case "$state" in
                  BEHIND)
                    echo "Updating PR #$number"
                    gh pr update-branch "$number" || true
                    ;;
                  DIRTY)
                    echo "PR #$number has conflicts"
                    echo "$number" >> "$RUNNER_TEMP/conflict-prs.txt"
                    ;;
                esac
              done
          if [ -s "$RUNNER_TEMP/conflict-prs.txt" ]; then
            conflicts=$(paste -sd, "$RUNNER_TEMP/conflict-prs.txt")
          fi
          echo "conflict_prs=$conflicts" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: steps.update.outputs.conflict_prs != ''
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          prompt: |
            ${{ env.REPO_GUIDANCE }}

            These `claude/*` PRs have merge conflicts with the default
            branch: ${{ steps.update.outputs.conflict_prs }}.

            For each PR: check out its branch, rebase onto the default
            branch, resolve conflicts (preferring the PR's intent for the
            files it touches, the default branch for everything else), run
            available lint/tests, and force-push the rebased branch. If
            conflicts are non-trivial or the rebase looks risky, skip that
            PR and post a short comment asking the author to rebase
            manually. Never force-push outside the PR's own `claude/*`
            branch.
          claude_args: --model claude-sonnet-4-6

  auto-approve-claude-prs:
    needs: preflight
    if: >-
      needs.preflight.outputs.should_run == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Approve PR as github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # GITHUB_TOKEN is github-actions[bot]; Claude's PRs are authored
          # by the Claude App, so this is a different identity and the
          # approval counts toward branch protection.
          gh pr review "$PR_NUMBER" --approve \
            --body "Auto-approved: PR authored by the Claude agent." || true

  sweep-old-issues:
    needs: preflight
    if: >-
      needs.preflight.outputs.should_run == 'true' &&
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      issues: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Find candidate issues
        id: pick
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          MAX: ${{ vars.CLAUDE_ISSUE_SWEEP_MAX || '3' }}
        run: |
          # Open issues that are unassigned, lack a `claude-no-fix` label,
          # have no `claude/issue-<n>` branch yet, and were opened > 24h
          # ago. Oldest first.
          cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          existing_branches=$(gh api "repos/${{ github.repository }}/branches?per_page=100" \
            --jq '.[].name' | grep -E '^claude/issue-[0-9]+$' || true)
          mapfile -t skip_numbers < <(echo "$existing_branches" | sed -E 's@^claude/issue-([0-9]+)$@\1@')
          skip_csv=$(IFS=,; echo "${skip_numbers[*]}")
          picked=$(gh issue list --state open --limit 100 \
            --json number,createdAt,assignees,labels \
            --jq "[.[] | select(.createdAt < \"$cutoff\") | select(.assignees | length == 0) | select(.labels | map(.name) | index(\"claude-no-fix\") | not) | select((\"$skip_csv\" | split(\",\")) | index((.number | tostring)) | not)] | sort_by(.createdAt) | .[0:$MAX] | map(.number) | join(\",\")")
          echo "Picked issues: $picked"
          echo "issues=$picked" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: steps.pick.outputs.issues != ''
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          prompt: |
            ${{ env.REPO_GUIDANCE }}

            These open issues were picked up by the daily sweep because
            they're unassigned and untouched: ${{ steps.pick.outputs.issues }}.

            For each issue: read the body, decide whether it's actionable
            (a clear bug report, a small feature, a doc fix). If so, create
            a `claude/issue-<number>` branch, implement the fix, run any
            tests, open a PR linking the issue with
            `gh pr merge <pr> --squash --auto --delete-branch` when
            ${{ needs.preflight.outputs.use_auto_merge }} is "true". If the
            issue is unclear, asks a question, requires architectural
            decisions, or you can't confidently fix it, post a short
            comment on the issue explaining why you're not auto-fixing and
            add the `claude-no-fix` label so we don't pick it up again.
          claude_args: --model claude-sonnet-4-6

  janitor:
    needs: preflight
    if: >-
      needs.preflight.outputs.should_run == 'true' &&
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Close stale claude/* PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          STALE_DAYS: ${{ vars.CLAUDE_PR_STALE_DAYS || '14' }}
          EXHAUSTED_DAYS: ${{ vars.CLAUDE_PR_EXHAUSTED_DAYS || '3' }}
        run: |
          stale_cutoff=$(date -u -d "$STALE_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          exhausted_cutoff=$(date -u -d "$EXHAUSTED_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          # Truly stale: claude/* PR with no updates for STALE_DAYS days.
          gh pr list --state open --limit 100 \
            --json number,headRefName,updatedAt,labels \
            --jq ".[] | select(.headRefName | startswith(\"claude/\")) | select(.updatedAt < \"$stale_cutoff\") | .number" \
            | while read -r number; do
                echo "Closing stale PR #$number"
                gh pr close "$number" \
                  --comment "Closing as stale (no activity in ${STALE_DAYS}+ days). Reopen if still relevant." \
                  --delete-branch || true
              done
          # Exhausted CI retries: claude/* PR with claude-ci-retry-3 label
          # and no progress for EXHAUSTED_DAYS days.
          gh pr list --state open --limit 100 \
            --json number,headRefName,updatedAt,labels \
            --jq ".[] | select(.headRefName | startswith(\"claude/\")) | select(.labels | map(.name) | index(\"claude-ci-retry-3\")) | select(.updatedAt < \"$exhausted_cutoff\") | .number" \
            | while read -r number; do
                echo "Closing PR #$number (CI retries exhausted)"
                gh pr close "$number" \
                  --comment "Closing: CI failed 3 times and no progress in ${EXHAUSTED_DAYS}+ days. Reopen with manual fixes if still wanted." \
                  --delete-branch || true
              done
